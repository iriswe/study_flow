name: studyflow_app
description: "StudyFlow - 学习目标与复习管理系统"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # 状态管理 - Riverpod
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 路由
  go_router: ^14.6.2

  # HTTP 请求
  dio: ^5.7.0

  # 本地存储
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 依赖注入
  get_it: ^8.0.3

  # 工具库
  intl: ^0.19.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  collection: ^1.19.0

  # 图表
  fl_chart: ^0.69.2

  # 富文本编辑器
  flutter_quill: ^10.8.5

  # 图片处理
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # 动画
  flutter_animate: ^4.5.2

  # 网络状态
  connectivity_plus: ^6.1.1

  # 文件路径
  path_provider: ^2.1.5

  # URL 处理
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # Markdown
  flutter_markdown: ^0.7.4+3
  markdown: ^7.2.2

  # 表单验证
  formz: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/